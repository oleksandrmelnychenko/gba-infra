# Full GBA stack — frontends, APIs, SQL Server, search.
# All services share the default compose network and reach each
# other by service name. Connection strings are injected as env
# vars (ConnectionStrings__*) so committed appsettings stay untouched.
#
# Build contexts point at sibling repositories — they must be checked
# out next to this one (see README.md).
name: gba

x-sql-password: &sql-password "GbaLocal!2026Dev"

services:

  gba-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gba-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: *sql-password
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - gba-mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  typesense:
    image: typesense/typesense:27.1
    container_name: gba-typesense
    command: ["--data-dir", "/data", "--api-key", "gba-search-secret-key", "--enable-cors"]
    ports:
      - "8108:8108"
    volumes:
      - gba-typesense-data:/data
    restart: unless-stopped

  data-concord:
    image: gba-data-concord:latest
    build:
      context: ../gba-server
      args:
        PROJECT: data.concord
    container_name: gba-data-concord
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__LocalConnectionString: "Server=gba-mssql,1433;Database=ConcordDb_V5;User Id=sa;Password=GbaLocal!2026Dev;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;"
      ConnectionStrings__LocalIdentityConnectionString: "Server=gba-mssql,1433;Database=ConcordIdentityDb;User Id=sa;Password=GbaLocal!2026Dev;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;"
    ports:
      - "35981:35981"
    depends_on:
      gba-mssql:
        condition: service_healthy
    restart: unless-stopped

  data-analytics:
    image: gba-data-analytics:latest
    build:
      context: ../gba-server
      args:
        PROJECT: data.analytics.concord
    container_name: gba-data-analytics
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__LocalConnectionString: "Server=gba-mssql,1433;Database=ConcordDb_V5;User Id=sa;Password=GbaLocal!2026Dev;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;"
      ConnectionStrings__LocalConnectionStringDataAnalitic: "Server=gba-mssql,1433;Database=ConcordDb_Data;User Id=sa;Password=GbaLocal!2026Dev;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;"
      ConnectionStrings__LocalIdentityConnectionString: "Server=gba-mssql,1433;Database=ConcordIdentityDb;User Id=sa;Password=GbaLocal!2026Dev;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;"
    ports:
      - "35982:35982"
    depends_on:
      gba-mssql:
        condition: service_healthy
    restart: unless-stopped

  gba-ecommerce-api:
    image: gba-ecommerce-api:latest
    build:
      context: ../gba-ecommerce-api
    container_name: gba-ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__RemoteConnectionString: "Server=gba-mssql,1433;Database=ConcordDb_V5;User Id=sa;Password=GbaLocal!2026Dev;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;"
      ConnectionStrings__RemoteIdentityConnectionString: "Server=gba-mssql,1433;Database=ConcordIdentityDb;User Id=sa;Password=GbaLocal!2026Dev;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;"
      ConnectionStrings__LocalConnectionString: "Server=gba-mssql,1433;Database=ConcordDb_V5;User Id=sa;Password=GbaLocal!2026Dev;TrustServerCertificate=True;Encrypt=False;Connect Timeout=60;"
      Typesense__Url: "http://typesense:8108"
      Typesense__ApiKey: "gba-search-secret-key"
    ports:
      - "62506:62506"
    depends_on:
      gba-mssql:
        condition: service_healthy
      typesense:
        condition: service_started
    restart: unless-stopped

  gba-client:
    image: gba-client:latest
    build:
      context: ../gba_client
    container_name: gba-client
    ports:
      - "8082:80"
    restart: unless-stopped

  gba-ecommerce:
    image: gba-ecommerce:latest
    build:
      context: ../gba_ecommerce
    container_name: gba-ecommerce
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  gba-mssql-data:
    external: true
  gba-typesense-data:
