# Base stack definition — shared by both environments.
# Run with an environment overlay (see Makefile / README):
#   dev : docker compose -p gba-dev  -f docker-compose.yml -f docker-compose.dev.yml  --env-file .env.dev  up -d
#   prod: docker compose -p gba-prod -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Secrets and host ports are defined only in the overlays.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  gba-mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD}
      MSSQL_PID: Developer
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      discovery.type: single-node
      action.destructive_requires_name: "true"
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.security.authc.api_key.enabled: "false"
      ELASTIC_PASSWORD_FILE: /run/secrets/elastic_password
      cluster.name: gba-search
      bootstrap.memory_lock: "true"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    secrets:
      - source: Elasticsearch__Password
        target: elastic_password
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9200/ | grep -q '^401$'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    logging: *default-logging

  elasticsearch-setup:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    user: "0"
    entrypoint: ["/bin/sh", "/usr/local/bin/setup-elasticsearch-security.sh"]
    environment:
      ELASTICSEARCH_URL: "http://elasticsearch:9200"
      ELASTIC_APP_USERNAME: "gba_products_app"
      ELASTIC_APP_ROLE: "gba_products_app"
    volumes:
      - ./scripts/setup-elasticsearch-security.sh:/usr/local/bin/setup-elasticsearch-security.sh:ro
    secrets:
      - source: Elasticsearch__Password
        target: elastic_password
      - source: Elasticsearch__AppPassword
        target: app_password
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"
    logging: *default-logging

  data-concord:
    image: gba-data-concord:latest
    build:
      context: ../gba-server
      args:
        PROJECT: Global.Business.Assistant.Api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    secrets:
      - source: ConnectionStrings__LocalConnectionString
        target: ConnectionStrings:LocalConnectionString
      - source: ConnectionStrings__LocalIdentityConnectionString
        target: ConnectionStrings:LocalIdentityConnectionString
      - source: ConnectionStrings__FenixOneCConnectionString
        target: ConnectionStrings:FenixOneCConnectionString
      - source: ConnectionStrings__AmgOneCConnectionString
        target: ConnectionStrings:AmgOneCConnectionString
      - source: Security__JwtKey
        target: Security:JwtKey
    depends_on:
      gba-mssql:
        condition: service_healthy
    logging: *default-logging

  data-analytics:
    image: gba-data-analytics:latest
    build:
      context: ../gba-server
      args:
        PROJECT: Global.Business.Assistant.Analytics
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
    secrets:
      - source: ConnectionStrings__LocalConnectionString
        target: ConnectionStrings:LocalConnectionString
      - source: ConnectionStrings__LocalConnectionStringDataAnalitic
        target: ConnectionStrings:LocalConnectionStringDataAnalitic
      - source: ConnectionStrings__LocalIdentityConnectionString
        target: ConnectionStrings:LocalIdentityConnectionString
      - source: ConnectionStrings__FenixOneCConnectionString
        target: ConnectionStrings:FenixOneCConnectionString
      - source: ConnectionStrings__AmgOneCConnectionString
        target: ConnectionStrings:AmgOneCConnectionString
      - source: Security__JwtKey
        target: Security:JwtKey
    depends_on:
      gba-mssql:
        condition: service_healthy
    logging: *default-logging

  gba-ecommerce-api:
    image: gba-ecommerce-api:latest
    build:
      context: ../gba-ecommerce-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Elasticsearch__Url: "http://elasticsearch:9200"
      Elasticsearch__Username: "gba_products_app"
    secrets:
      - source: ConnectionStrings__RemoteConnectionString
        target: ConnectionStrings:RemoteConnectionString
      - source: ConnectionStrings__RemoteIdentityConnectionString
        target: ConnectionStrings:RemoteIdentityConnectionString
      - source: ConnectionStrings__LocalConnectionString
        target: ConnectionStrings:LocalConnectionString
      - source: Security__JwtKey
        target: Security:JwtKey
      - source: Security__PriceEncryptionKey
        target: Security:PriceEncryptionKey
      - source: Security__PriceEncryptionIV
        target: Security:PriceEncryptionIV
      - source: Elasticsearch__AppPassword
        target: Elasticsearch:Password
    depends_on:
      gba-mssql:
        condition: service_healthy
      elasticsearch-setup:
        condition: service_completed_successfully
      data-concord:
        condition: service_started
    logging: *default-logging

  gba-client:
    image: gba-client:latest
    build:
      context: ../gba_client
    depends_on:
      - data-concord
      - data-analytics
    logging: *default-logging

  gba-ecommerce:
    image: gba-ecommerce:latest
    build:
      context: ../gba_ecommerce
    depends_on:
      - gba-ecommerce-api
      - data-analytics
    logging: *default-logging

volumes:
  mssql-data:
  elasticsearch-data:
