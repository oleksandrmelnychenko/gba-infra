        target: ConnectionStrings:VehicleRegistryConnectionString
      - source: RecommendationApi__ApiKey
        target: RecommendationApi:ApiKey
      - source: ProcurementApi__ApiKey
        target: ProcurementApi:ApiKey
      - source: GbaNbaApi__ApiKey
        target: GbaNbaApi:ApiKey
      - source: SolvencyApi__ApiKey
        target: SolvencyApi:ApiKey
      - source: PricingApi__ApiKey
        target: PricingApi:ApiKey
      - source: ProductsApi__ApiKey
        target: ProductsApi:ApiKey
      - source: ForecastApi__ApiKey
        target: ForecastApi:ApiKey
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Security__JwtIssuer: "ConcordCRM"
      Security__JwtAudience: "https://gba-api-dev.85.17.167.167.nip.io/"
      Security__AcceptLegacyHs256Tokens: "${GBA_ACCEPT_LEGACY_HS256_TOKENS:-false}"
      Security__AccessTokenLifetimeMinutes: "15"
      Security__RefreshTokenLifetimeMinutes: "43200"
      ShopAuth__JwtIssuer: "GbaShop"
      ShopAuth__JwtAudience: "GbaShop"
      ShopAuth__AcceptLegacySharedTokens: "false"
      GBA_CRM_SERVER_URL: "https://gba-api-dev.85.17.167.167.nip.io"
      GBA_ECOMMERCE_CLIENT_URL: "https://shop-dev.85.17.167.167.nip.io"
      RecommendationApi__Url: "http://host.docker.internal:8000"
      RecommendationApi__TimeoutSeconds: "120"
      GbaNbaApi__Url: "http://host.docker.internal:8002"
      GbaNbaApi__TimeoutSeconds: "120"
      ProcurementApi__Url: "http://host.docker.internal:8001"
      ProcurementApi__TimeoutSeconds: "120"
      SolvencyApi__Url: "http://host.docker.internal:8003"
      PricingApi__Url: "http://host.docker.internal:8004"
      PricingApi__TimeoutSeconds: "240"
      ProductsApi__Url: "http://host.docker.internal:8005"
      ProductsApi__TimeoutSeconds: "60"
      ForecastApi__Url: "http://host.docker.internal:8006"
      ForecastApi__TimeoutSeconds: "30"
      GBA_DATASYNC_ALLOW_OUTCOME_SETTLEMENT_BACKFILL: "true"
      GBA_ALLOW_FIXED_HISTORICAL_STOCK_TRANSITION: "1"
      DataSync__ImportedDocumentResponsibleUserNetUid: "37E979EB-A58D-4BEB-994B-121B119844ED"
      DataSync__ImportedDocumentUnmatchedResponsibleUserNetUid: "123E9F21-D726-49CB-BAD9-ECDEDC0E4D3F"
      DataSync__FenixClientCataloguePageSize: "512"
      DataSync__FenixReturnItemCaptureBatchSize: "64"
      GBA_LIBREOFFICE_POOL_ENABLED: "true"
      GBA_DOCUMENT_CONVERSION_TIMINGS: "true"
      GbaNbaApi__SourceEnvironment: "dev"
      ProductsApi__SourceEnvironment: "dev"
      DataSync__HistoricalDocumentUnits__AdmissionsJson: '[{"ForAmg":false,"ConnectionDataSource":"85.17.167.168,1433","SqlServerName":"1C-NEW","ConfigurationId":"1e4190e9-76c2-456e-a607-4d817110ffd9","SourceSealSha256":"2DC4518D5E9AF76ECDE45800D90C31FD3D78415DC3F644688CF06629FA2CCE65","SourceSchemaSha256":"1D07A98ADED2CB59359336778DF4A257A6D503781539C53228FA8AC311E1E413","SaleMetadataSha256":"42499C6B9E0D832E29C1D6AA8D20929F89691B86CB9C20AFFCB1CFC2B82CDC61","SaleSchemaSha256":"EC0B522D9DB80F38A8F1465C93D64A20E85D72E39F17AC76697445A30BF500D4","ReturnMetadataSha256":"59F07742BF9695220DE234D7705FED84F16064ACE8F6C3CD7C2D1454DC4E7398","ReturnSchemaSha256":"9F42BCBF0E1E26732FFB48446F234FFBAF57C195C1A59D3EAC2C5503913608C1"},{"ForAmg":true,"ConnectionDataSource":"85.17.167.168,1433","SqlServerName":"1C-NEW","ConfigurationId":"1e4190e9-76c2-456e-a607-4d817110ffd9","SourceSealSha256":"EDABB70744634E5D87E4FFFF7FEE20C44850843BA50CA4CAE95ADEDD18E8AF16","SourceSchemaSha256":"BFC795085DEF16C34AA3BF23524E331AD7C058EBB3D809005F706B2324560AC5","SaleMetadataSha256":"6B300E77B4C79507C1BF181E6C0B5A08B391D1146FB1F49C78E71097143DEE5C","SaleSchemaSha256":"CCBBAD95F0BF20C0BBD8B16BE465BF6AFFE7ED6650444466675592804877065B","ReturnMetadataSha256":"59F07742BF9695220DE234D7705FED84F16064ACE8F6C3CD7C2D1454DC4E7398","ReturnSchemaSha256":"E3653862A30A24A4BE66CF9DE315D821B4051F4908172AE45B7B228EE5EA1742"}]'
      Security__CorsOrigins__0: "http://localhost:3000"
      Security__CorsOrigins__1: "http://localhost:7000"
      Security__CorsOrigins__2: "http://localhost:8081"
      Security__CorsOrigins__3: "http://localhost:8082"
      Security__CorsOrigins__4: "http://127.0.0.1:3000"
      Security__CorsOrigins__5: "http://127.0.0.1:7000"
      Security__CorsOrigins__6: "http://127.0.0.1:8081"
      Security__CorsOrigins__7: "http://127.0.0.1:8082"
      Security__CorsOrigins__8: "http://85.17.167.167:8081"
      Security__CorsOrigins__9: "http://85.17.167.167:8082"
      Security__CorsOrigins__10: "http://shop-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__11: "http://gba-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__12: "https://shop-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__13: "https://gba-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__14: "http://localhost:8083"
      Security__CorsOrigins__15: "http://127.0.0.1:8083"
      Security__CorsOrigins__16: "http://85.17.167.167:8083"
      Security__CorsOrigins__17: "http://gba-console-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__18: "https://gba-console-dev.85.17.167.167.nip.io"
    volumes:
      - ../gba-server/src/Global.Business.Assistant.Api/Data:/app/Data
      - ../gba-server/src/Global.Business.Assistant.Api/Images:/app/Images
      - ../gba-server/src/Global.Business.Assistant.Api/Logs:/app/Logs
      - aspnet-dataprotection-keys-dev:/root/.aspnet/DataProtection-Keys
      - /private/bug1274-settlement-source-paced.lock:/private/bug1274-settlement-source-paced.lock
      - /private/gba-fenix-separate-plan-reader-20260929:/private/gba-fenix-separate-plan-reader-20260929:ro
      - /private/gba-debtor41-graph-two-page-io-v2-20260930/full-admission-20260930:/private/gba-debtor41-graph-two-page-io-v2-20260930/full-admission-20260930:ro
      - /private/gba-price28-normal-sync-state-20261001:/private/gba-price28-normal-sync-state-20261001
      - /root/.private/gba-constructor-capture/agreement-price-full-capture-20260919-ro2:/root/.private/gba-constructor-capture/agreement-price-full-capture-20260919-ro2:ro
      - /private/gba-discount23-25-normal-sync-state-20261001:/private/gba-discount23-25-normal-sync-state-20261001
    ports:
      - "127.0.0.1:35981:35981"
      - "${GBA_DOCKER_HOST_GATEWAY_IP:-172.17.0.1}:35981:35981"
    restart: unless-stopped

  data-analytics:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Security__JwtIssuer: "ConcordCRM"
      Security__JwtAudience: "https://gba-api-dev.85.17.167.167.nip.io/"
      Security__AcceptLegacyHs256Tokens: "${GBA_ACCEPT_LEGACY_HS256_TOKENS:-false}"
      ShopAuth__JwtIssuer: "GbaShop"
      ShopAuth__JwtAudience: "GbaShop"
      ShopAuth__AcceptLegacySharedTokens: "false"
      Security__CorsOrigins__0: "http://localhost:3000"
      Security__CorsOrigins__1: "http://localhost:7000"
      Security__CorsOrigins__2: "http://localhost:8081"
      Security__CorsOrigins__3: "http://localhost:8082"
      Security__CorsOrigins__4: "http://127.0.0.1:3000"
      Security__CorsOrigins__5: "http://127.0.0.1:7000"
      Security__CorsOrigins__6: "http://127.0.0.1:8081"
      Security__CorsOrigins__7: "http://127.0.0.1:8082"
      Security__CorsOrigins__8: "http://85.17.167.167:8081"
      Security__CorsOrigins__9: "http://85.17.167.167:8082"
      Security__CorsOrigins__10: "http://shop-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__11: "http://gba-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__12: "https://shop-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__13: "https://gba-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__14: "http://localhost:8083"
      Security__CorsOrigins__15: "http://127.0.0.1:8083"
      Security__CorsOrigins__16: "http://85.17.167.167:8083"
      Security__CorsOrigins__17: "http://gba-console-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__18: "https://gba-console-dev.85.17.167.167.nip.io"
    ports:
      - "127.0.0.1:35982:35982"
      - "${GBA_DOCKER_HOST_GATEWAY_IP:-172.17.0.1}:35982:35982"
    volumes:
      - aspnet-dataprotection-keys-dev:/root/.aspnet/DataProtection-Keys
    secrets:
      - source: ProcureCostInternalAuth__ApiKey
        target: ProcureCostInternalAuth:ApiKey
    restart: unless-stopped

  gba-ecommerce-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Security__JwtIssuer: "GbaShop"
      Security__JwtAudience: "GbaShop"
      GbaServerAuth__JwtIssuer: "ConcordCRM"
      GbaServerAuth__JwtAudience: "https://gba-api-dev.85.17.167.167.nip.io/"
      Security__CorsOrigins__0: "http://localhost:3000"
      Security__CorsOrigins__1: "http://localhost:7000"
      Security__CorsOrigins__2: "http://localhost:8081"
      Security__CorsOrigins__3: "http://127.0.0.1:3000"
      Security__CorsOrigins__4: "http://127.0.0.1:7000"
      Security__CorsOrigins__5: "http://127.0.0.1:8081"
      Security__CorsOrigins__6: "https://new.concord-shop.com"
      Security__CorsOrigins__7: "http://85.17.167.167:8081"
      Security__CorsOrigins__8: "http://85.17.167.167:8082"
      Security__CorsOrigins__9: "http://shop-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__10: "http://gba-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__11: "https://shop-dev.85.17.167.167.nip.io"
      Security__CorsOrigins__12: "https://gba-dev.85.17.167.167.nip.io"
    ports:
      - "127.0.0.1:62506:62506"
      - "${GBA_DOCKER_HOST_GATEWAY_IP:-172.17.0.1}:62506:62506"
    restart: unless-stopped

  gba-client:
    environment:
      SERVER_URL: "https://gba-api-dev.85.17.167.167.nip.io/"
      SERVER_URL_V2: "https://gba-analytics-dev.85.17.167.167.nip.io/"
    ports:
      - "127.0.0.1:8082:80"
      - "${GBA_DOCKER_HOST_GATEWAY_IP:-172.17.0.1}:8082:80"
    restart: unless-stopped

  gba-console:
    image: gba-console:latest
    build:
      context: ${GBA_CONSOLE_BUILD_CONTEXT:-../gba_console}
      args:
        VITE_API_BASE_URL: "/"
        VITE_API_LANGUAGE: "uk"
      labels:
        gba.git.sha: "${GBA_CONSOLE_GIT_SHA:-unknown}"
    environment:
      API_PROXY_TARGET: "http://data-concord:35981"
      GBA_QA_ENABLED: "true"
      API_QA_PROXY_TARGET: "http://data-concord-qa:35981"
      API_QA_HISTORY_PROXY_TARGET: "http://data-analytics-qa:35982"
    ports:
      - "127.0.0.1:8083:80"
      - "${GBA_DOCKER_HOST_GATEWAY_IP:-172.17.0.1}:8083:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/build.json || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # nginx консолі проксіює на data-analytics: без запущеного контейнера upstream
    # не резолвиться і nginx падає в рестарт-цикл одразу на старті.
    depends_on:
      data-concord:
        condition: service_healthy
      data-analytics:
        condition: service_healthy

  gba-ecommerce:
    build:
      args:
        API_BASE_URL: "http://gba-ecommerce-api:62506"
        API_HISTORY_URL: "http://data-analytics:35982"
        NEXT_PUBLIC_API_BASE_URL: "https://ecom-api-dev.85.17.167.167.nip.io"
        NEXT_PUBLIC_SITE_URL: "https://shop-dev.85.17.167.167.nip.io"
        NEXT_PUBLIC_BASE_URL: "https://shop-dev.85.17.167.167.nip.io"
        NEXT_PUBLIC_STATIC_BASE_URL: "https://gba-api-dev.85.17.167.167.nip.io"
    environment:
      # The storefront decodes the protected price payload server-side, so it needs the same
      # AES material the API encrypts with — without it every product renders without a price.
      PRICE_KEY: ${PRICE_ENCRYPTION_KEY}
      PRICE_IV: ${PRICE_ENCRYPTION_IV}
      # Authentication fails closed unless the storefront verifies the exact JWT signing
      # secret used by the APIs. The value is loaded from the Docker secret by the command
      # below and is also the documented DEV fallback for stable public price-token sealing.
      AUTH_JWT_ALGORITHM: "HS256"
      AUTH_JWT_ISSUER: "GbaShop"
      AUTH_JWT_AUDIENCE: "GbaShop"
      APP_ALLOWED_ORIGINS: "https://shop-dev.85.17.167.167.nip.io"
      RATE_LIMIT_CLIENT_IP_HEADER: "x-forwarded-for"
      API_BASE_URL: "http://gba-ecommerce-api:62506"
      API_HISTORY_URL: "http://data-analytics:35982"
      NEXT_PUBLIC_API_BASE_URL: "https://ecom-api-dev.85.17.167.167.nip.io"
      NEXT_PUBLIC_SITE_URL: "https://shop-dev.85.17.167.167.nip.io"
      NEXT_PUBLIC_BASE_URL: "https://shop-dev.85.17.167.167.nip.io"
      NEXT_PUBLIC_STATIC_BASE_URL: "https://gba-api-dev.85.17.167.167.nip.io"
      # Guests may decode only the retail price selected by the ecommerce API.
      PRICE_VISIBILITY: "public"
      IMAGE_SEARCH_MODEL: "claude-sonnet-5"
    secrets:
      - source: ShopAuth__JwtKey
        target: StorefrontAuthSecret
      - source: Storefront__PriceTokenSecret
        target: StorefrontPriceTokenSecret
      - source: Anthropic__ApiKey
        target: AnthropicApiKey
    # DEV secret files are group-readable by the non-root .NET runtime GID.
    # Grant the non-root Next.js process the same supplementary group instead
    # of making the signing secret world-readable or running the app as root.
    group_add:
      - "1654"
    command:
      - /bin/sh
      - -ec
      - |
        export AUTH_SECRET="$$(cat /run/secrets/StorefrontAuthSecret)"
        export PRICE_TOKEN_SECRET="$$(cat /run/secrets/StorefrontPriceTokenSecret)"
        export ANTHROPIC_API_KEY="$$(cat /run/secrets/AnthropicApiKey)"
        exec node server.js
    ports:
      - "127.0.0.1:8081:3000"
      - "${GBA_DOCKER_HOST_GATEWAY_IP:-172.17.0.1}:8081:3000"
    restart: unless-stopped

secrets:
  ConnectionStrings__VehicleRegistryConnectionString:
    file: ./secrets/dev/ConnectionStrings__VehicleRegistryConnectionString
  ConnectionStrings__LocalConnectionString:
    file: ./secrets/dev/ConnectionStrings__LocalConnectionString
  ConnectionStrings__LocalIdentityConnectionString:
    file: ./secrets/dev/ConnectionStrings__LocalIdentityConnectionString
  ConnectionStrings__LocalConnectionStringDataAnalitic:
    file: ./secrets/dev/ConnectionStrings__LocalConnectionStringDataAnalitic
  ConnectionStrings__RemoteConnectionString:
    file: ./secrets/dev/ConnectionStrings__RemoteConnectionString
  ConnectionStrings__RemoteIdentityConnectionString:
    file: ./secrets/dev/ConnectionStrings__RemoteIdentityConnectionString
  ConnectionStrings__FenixOneCConnectionString:
    file: /private/gba-dev-full-reset-20261007/fenix-readonly.connection
  ConnectionStrings__AmgOneCConnectionString:
    file: /private/gba-dev-full-reset-20261007/amg-readonly.connection
  ConnectionStrings__FenixOneCReadOnlyConnectionString:
    file: /private/gba-dev-full-reset-20261007/fenix-readonly.connection
  ConnectionStrings__AmgOneCReadOnlyConnectionString:
    file: /private/gba-dev-full-reset-20261007/amg-readonly.connection
  Security__JwtKey:
    file: ./secrets/dev/Security__JwtKey
  Security__JwtPrivateKey:
    file: ./secrets/dev/Security__JwtPrivateKey
  Security__JwtPublicKey:
    file: ./secrets/dev/Security__JwtPublicKey
  ShopAuth__JwtKey:
    file: ./secrets/dev/ShopAuth__JwtKey
  Security__PriceEncryptionKey:
    file: ./secrets/dev/Security__PriceEncryptionKey
  Security__PriceEncryptionIV:
    file: ./secrets/dev/Security__PriceEncryptionIV
  Elasticsearch__Password:
    file: ./secrets/dev/Elasticsearch__Password
  Elasticsearch__AppPassword:
    file: ./secrets/dev/Elasticsearch__AppPassword
  EcommerceInternalAuth__ApiKey:
    file: ./secrets/dev/EcommerceInternalAuth__ApiKey
  Anthropic__ApiKey:
    file: ./secrets/dev/Anthropic__ApiKey
  Storefront__PriceTokenSecret:
    file: ./secrets/dev/Storefront__PriceTokenSecret
  ProcureCostInternalAuth__ApiKey:
    file: ./secrets/dev/ProcureCostInternalAuth__ApiKey
  RecommendationApi__ApiKey:
    file: ./secrets/dev/RecommendationApi__ApiKey
  ProcurementApi__ApiKey:
    file: ./secrets/dev/ProcurementApi__ApiKey
  GbaNbaApi__ApiKey:
    file: ./secrets/dev/GbaNbaApi__ApiKey
  SolvencyApi__ApiKey:
    file: ./secrets/dev/SolvencyApi__ApiKey
  PricingApi__ApiKey:
    file: ./secrets/dev/PricingApi__ApiKey
  ProductsApi__ApiKey:
    file: ./secrets/dev/ProductsApi__ApiKey
  ForecastApi__ApiKey:
    file: ./secrets/dev/ForecastApi__ApiKey

volumes:
  mssql-data:
    name: gba-mssql-data
    external: true
  aspnet-dataprotection-keys-dev:
