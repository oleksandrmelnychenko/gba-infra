# DEV overlay — host ports exposed only on loopback and the private Docker host gateway.
# Reuses the existing external gba-mssql-data volume (restored databases).
#   docker compose -p gba-dev -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up -d

services:

  gba-mssql:
    ports:
      - "127.0.0.1:1433:1433"
    restart: unless-stopped

  elasticsearch:
    ports:
      - "127.0.0.1:9200:9200"
    restart: unless-stopped

  data-concord:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - source: ConnectionStrings__FenixOneCReadOnlyConnectionString
        target: ConnectionStrings:FenixOneCReadOnlyConnectionString
      - source: ConnectionStrings__AmgOneCReadOnlyConnectionString
        target: ConnectionStrings:AmgOneCReadOnlyConnectionString
