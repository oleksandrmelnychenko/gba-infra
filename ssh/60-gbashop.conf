# Client-store source access. The account uses git-shell and a restricted key;
# it is intentionally unable to open a shell, tunnel ports, or reach Docker.
Match User gbashop
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    DisableForwarding yes
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    ForceCommand /usr/local/sbin/gbashop-git-readonly
    MaxAuthTries 3
    MaxSessions 2

Match all
