# PROD overlay — only Caddy is exposed to the host (80/443, TLS).
# APIs, DB and Elasticsearch stay on the internal network.
#   docker compose -p gba-prod -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:

  gba-mssql:
    restart: always

  elasticsearch:
    restart: always

  data-concord:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__JwtIssuer: "ConcordCRM"
      Security__JwtAudience: "https://api.${PROD_DOMAIN}/"
      GBA_CRM_SERVER_URL: "http://localhost:35981"
      GBA_ECOMMERCE_CLIENT_URL: "https://shop.${PROD_DOMAIN}"
      Security__CorsOrigins__0: "https://crm.${PROD_DOMAIN}"
      Security__CorsOrigins__1: "https://shop.${PROD_DOMAIN}"
    secrets: !override
      - source: ConnectionStrings__LocalConnectionString
        target: ConnectionStrings:LocalConnectionString
      - source: ConnectionStrings__LocalIdentityConnectionString
        target: ConnectionStrings:LocalIdentityConnectionString
      - source: Security__JwtKey
        target: Security:JwtKey
    restart: always

  data-analytics:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__JwtIssuer: "ConcordCRM"
      Security__JwtAudience: "https://api.${PROD_DOMAIN}/"
      Security__CorsOrigins__0: "https://crm.${PROD_DOMAIN}"
      Security__CorsOrigins__1: "https://shop.${PROD_DOMAIN}"
    secrets: !override
      - source: ConnectionStrings__LocalConnectionString
        target: ConnectionStrings:LocalConnectionString
      - source: ConnectionStrings__LocalConnectionStringDataAnalitic
        target: ConnectionStrings:LocalConnectionStringDataAnalitic
      - source: ConnectionStrings__LocalIdentityConnectionString
        target: ConnectionStrings:LocalIdentityConnectionString
      - source: Security__JwtKey
        target: Security:JwtKey
    restart: always

  gba-ecommerce-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Security__JwtIssuer: "ConcordCRM"
      Security__JwtAudience: "https://api.${PROD_DOMAIN}/"
      Security__CorsOrigins__0: "https://shop.${PROD_DOMAIN}"
      Security__CorsOrigins__1: "https://crm.${PROD_DOMAIN}"
    restart: always

  gba-client:
    environment:
      SERVER_URL: "https://api.${PROD_DOMAIN}/"
      SERVER_URL_V2: "https://analytics.${PROD_DOMAIN}/"
    restart: always

  gba-ecommerce:
    build:
      args:
        API_BASE_URL: "http://gba-ecommerce-api:62506"
        API_HISTORY_URL: "http://data-analytics:35982"
        NEXT_PUBLIC_API_BASE_URL: "https://ecom-api.${PROD_DOMAIN}"
        NEXT_PUBLIC_SITE_URL: "https://shop.${PROD_DOMAIN}"
        NEXT_PUBLIC_BASE_URL: "https://shop.${PROD_DOMAIN}"
    environment:
      API_BASE_URL: "http://gba-ecommerce-api:62506"
      API_HISTORY_URL: "http://data-analytics:35982"
      NEXT_PUBLIC_API_BASE_URL: "https://ecom-api.${PROD_DOMAIN}"
      NEXT_PUBLIC_SITE_URL: "https://shop.${PROD_DOMAIN}"
      NEXT_PUBLIC_BASE_URL: "https://shop.${PROD_DOMAIN}"
    restart: always

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gba-client
      - gba-ecommerce
      - data-concord
      - data-analytics
      - gba-ecommerce-api
    logging: *default-logging

secrets:
  ConnectionStrings__LocalConnectionString:
    file: ./secrets/prod/ConnectionStrings__LocalConnectionString
  ConnectionStrings__LocalIdentityConnectionString:
    file: ./secrets/prod/ConnectionStrings__LocalIdentityConnectionString
  ConnectionStrings__LocalConnectionStringDataAnalitic:
    file: ./secrets/prod/ConnectionStrings__LocalConnectionStringDataAnalitic
  ConnectionStrings__RemoteConnectionString:
    file: ./secrets/prod/ConnectionStrings__RemoteConnectionString
  ConnectionStrings__RemoteIdentityConnectionString:
    file: ./secrets/prod/ConnectionStrings__RemoteIdentityConnectionString
  Security__JwtKey:
    file: ./secrets/prod/Security__JwtKey
  Security__PriceEncryptionKey:
    file: ./secrets/prod/Security__PriceEncryptionKey
  Security__PriceEncryptionIV:
    file: ./secrets/prod/Security__PriceEncryptionIV
  Elasticsearch__Password:
    file: ./secrets/prod/Elasticsearch__Password
  Elasticsearch__AppPassword:
    file: ./secrets/prod/Elasticsearch__AppPassword

volumes:
  mssql-data:
    name: gba-prod-mssql-data
  caddy-data:
  caddy-config:
