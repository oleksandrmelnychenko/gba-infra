# DEV BUG-1245 exact report-lineage and direct-repair release, 2026-09-13.
# Append to the current DEV Compose chain and target services explicitly with
# `up -d --no-deps --no-build`; database migrations are a separate one-shot step.
services:
  data-concord:
    image: gba-data-concord:main-63da3c2ea-report-daily-candidate
    secrets:
      - source: ConnectionStrings__FenixOneCReadOnlyConnectionString
        target: ConnectionStrings:FenixOneCReadOnlyConnectionString
  data-analytics:
    image: gba-data-analytics:main-63da3c2ea-report-daily-candidate
  gba-console:
    image: gba-console:main-093e644d-report-daily-candidate

secrets:
  ConnectionStrings__FenixOneCReadOnlyConnectionString:
    file: /root/projects/gba-infra/secrets/dev/ConnectionStrings__FenixOneCReadOnlyConnectionString
